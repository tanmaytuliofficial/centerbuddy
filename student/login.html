<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - CenterBuddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#6366f1', accent: '#f472b6' } } }
    }
  </script>
  <style>
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .text-gradient { background: linear-gradient(to right, #6366f1, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased min-h-screen flex items-center justify-center">
  <div class="absolute inset-0 bg-gradient-to-br from-primary/10 via-transparent to-accent/10"></div>
  <div class="relative z-10 w-full max-w-md px-4">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-2 mb-6">
        <svg class="w-10 h-10" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="url(#logoG)"/><path d="M20 10L28 26H12L20 10Z" fill="white"/><defs><linearGradient id="logoG" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs></svg>
        <span class="text-2xl font-bold text-gradient">CenterBuddy</span>
      </a>
      <h1 class="text-2xl font-bold">Welcome Back!</h1>
      <p class="text-gray-400 mt-2">Login to access your exam center dashboard</p>
    </div>

    <form id="loginForm" class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-2">Email</label>
        <input type="email" required placeholder="student@example.com" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition placeholder-gray-600">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-2">Password</label>
        <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition placeholder-gray-600">
      </div>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="rounded border-gray-600 bg-white/5">
          <span class="text-gray-400">Remember me</span>
        </label>
        <a href="#" class="text-primary hover:underline">Forgot password?</a>
      </div>
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-primary to-accent rounded-xl font-medium hover:opacity-90 transition">
        Login
      </button>
    </form>

    <p class="text-center mt-6 text-gray-400">
      Don't have an account? <a href="register.html" class="text-primary hover:underline">Sign up</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
