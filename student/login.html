<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

        "primary-container": "#005f73",
        "on-primary": "#ffffff",
        "on-primary-container": "#91d7ee",
        "secondary": "#845400",
        "secondary-container": "#ffa91e",
        "on-secondary": "#ffffff",
        "on-secondary-container": "#6a4300",
        "surface-container-lowest": "#ffffff",
        "surface-container-high": "#e7e8e9",
        "surface-container": "#edeeef",
        "on-surface": "#191c1d",
        "on-surface-variant": "#3f484c",
        "outline-variant": "#bfc8cc",
        "error": "#ba1a1a",
        "tertiary": "#004749",
        "tertiary-container": "#006163",
        "on-tertiary": "#ffffff",
        "on-tertiary-container": "#72dde0",
        "surface-dim": "#d9dadb",
        "surface-bright": "#f8f9fa",
        "error-container": "#ffdad6",
        "on-error": "#ffffff",
        "on-error-container": "#93000a",
        "primary-fixed": "#b2ebff",
        "primary-fixed-dim": "#8bd1e8",
        "on-primary-fixed": "#001f27",
        "on-primary-fixed-variant": "#004e5f",
        "secondary-fixed": "#ffddb6",
        "secondary-fixed-dim": "#ffb95a",
        "on-secondary-fixed": "#2a1800",
        "on-secondary-fixed-variant": "#643f00",
        "tertiary-fixed": "#89f3f6",

<style>
body { font-family: 'Inter', sans-serif; }
h1, h2, h3, h4, h5 { font-family: 'Public Sans', sans-serif; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.fill-icon { font-variation-settings: 'FILL' 1; }
.glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">

<!-- TopAppBar -->
<header class="bg-background/70 backdrop-blur-xl docked top-0 sticky z-50 border-b border-outline-variant/20 h-20">
<div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-full">
<div class="flex items-center gap-sm">
<a href="../index.html">
<span class="font-display text-headline-md font-bold text-primary">CenterBuddy</span>
</a>
</div>
<div class="flex items-center gap-sm">
<!-- Theme Toggle -->
<button id="themeToggle" class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined sun-icon">dark_mode</span>
<span class="material-symbols-outlined moon-icon hidden">light_mode</span>
</button>
</div>
</div>
</header>

<!-- Login Content -->
<main class="flex-1 flex items-center justify-center px-gutter py-xl">
<div class="w-full max-w-md">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-2xl shadow-lg border border-outline-variant/30 p-lg space-y-lg">
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Welcome Back</h1>
<p class="text-body-md text-on-surface-variant">Sign in to access your exam dashboard</p>
</div>

<!-- Google Sign In Button -->
<button class="w-full flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-xl hover:bg-surface-container transition-all">
<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
<span class="font-label-md text-label-md text-on-surface">Continue with Google</span>
</button>

<div class="flex items-center gap-sm">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">or sign in with</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>

<!-- Phone Number Login -->
<form id="phoneForm" class="space-y-md">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Phone Number</label>
<div class="flex">
<span class="inline-flex items-center px-md bg-surface-container text-on-surface-variant border border-r-0 border-outline-variant rounded-l-lg font-label-md text-label-md">+91</span>
<input type="tel" id="phone" maxlength="10" required placeholder="Enter 10-digit number" class="flex-1 px-md py-sm border border-outline-variant rounded-r-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-body-md placeholder:text-on-surface-variant/50">
</div>
<p id="phoneError" class="text-error text-label-sm mt-xs hidden">Please enter a valid 10-digit number</p>
</div>

<!-- OTP Section (Hidden initially) -->
<div id="otpSection" class="hidden space-y-md">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Enter OTP</label>
<div class="flex gap-xs">
<input type="text" maxlength="1" class="w-12 h-12 text-center border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-body-lg bg-surface-container-lowest">
<input type="text" maxlength="1" class="w-12 h-12 text-center border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-body-lg bg-surface-container-lowest">
<input type="text" maxlength="1" class="w-12 h-12 text-center border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-body-lg bg-surface-container-lowest">
<input type="text" maxlength="1" class="w-12 h-12 text-center border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-body-lg bg-surface-container-lowest">
</div>
<button type="button" class="text-primary font-label-md text-label-md hover:underline">Resend OTP</button>
</div>

<button type="submit" id="submitBtn" class="w-full py-sm bg-primary text-on-primary rounded-xl font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-all">
Send OTP
</button>
</form>

<!-- Demo Mode Note -->
<div class="text-center p-sm bg-surface-container rounded-lg">
<p class="text-label-sm text-label-sm text-on-surface-variant">Demo Mode: Click Send OTP, then Login</p>
</div>
</div>

<!-- Register Link -->
<div class="text-center mt-lg">
<p class="text-body-md text-on-surface-variant">
Don't have an account? 
<a href="register.html" class="text-primary font-label-md text-label-md hover:underline">Sign Up</a>
</p>
</div>
</div>
</main>

<script>
// Theme Toggle
const themeToggle = document.getElementById('themeToggle');
const html = document.documentElement;
if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');

themeToggle.addEventListener('click', () => {
  html.classList.toggle('dark');
  document.querySelector('.sun-icon').classList.toggle('hidden');
  document.querySelector('.moon-icon').classList.toggle('hidden');
  localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
});

// Phone validation
const phoneInput = document.getElementById('phone');
const phoneError = document.getElementById('phoneError');
const otpSection = document.getElementById('otpSection');
const submitBtn = document.getElementById('submitBtn');

phoneInput.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
});

phoneInput.addEventListener('blur', () => {
  if (phoneInput.value.length > 0 && phoneInput.value.length < 10) {
    phoneError.classList.remove('hidden');
  } else {
    phoneError.classList.add('hidden');
  }
});

document.getElementById('phoneForm').addEventListener('submit', (e) => {
  e.preventDefault();
  
  if (phoneInput.value.length !== 10) {
    phoneError.classList.remove('hidden');
    return;
  }
  
  // If OTP not shown, show it
  if (otpSection.classList.contains('hidden')) {
    otpSection.classList.remove('hidden');
    submitBtn.textContent = 'Verify & Login';
    return;
  }
  
  // Otherwise login
  window.location.href = 'dashboard.html';
});

// OTP input auto-focus
otpSection.querySelectorAll('input').forEach((input, index, inputs) => {
  input.addEventListener('input', () => {
    if (input.value && index < inputs.length - 1) {
      inputs[index + 1].focus();
    }
  });
});
</script>
</body>
</html>
