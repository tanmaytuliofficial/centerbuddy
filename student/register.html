<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - CenterBuddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#6366f1', accent: '#f472b6' } } }
    }
  </script>
  <style>
    .text-gradient { background: linear-gradient(to right, #6366f1, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased min-h-screen flex items-center justify-center py-12">
  <div class="absolute inset-0 bg-gradient-to-br from-primary/10 via-transparent to-accent/10"></div>
  
  <div class="relative z-10 w-full max-w-lg px-4">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-2 mb-6">
        <svg class="w-10 h-10" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="url(#logoG2)"/><path d="M20 10L28 26H12L20 10Z" fill="white"/><defs><linearGradient id="logoG2" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs></svg>
        <span class="text-2xl font-bold text-gradient">CenterBuddy</span>
      </a>
      <h1 class="text-2xl font-bold">Create Account</h1>
      <p class="text-gray-400 mt-2">Join CenterBuddy for exam logistics support</p>
    </div>

    <form id="registerForm" class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 space-y-4">
      <div class="flex justify-center gap-2 mb-6">
        <div id="step1Dot" class="w-3 h-3 rounded-full bg-primary"></div>
        <div id="step2Dot" class="w-3 h-3 rounded-full bg-white/20"></div>
      </div>

      <div id="step1">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-2">First Name</label>
            <input type="text" required placeholder="Rahul" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition placeholder-gray-600">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-2">Last Name</label>
            <input type="text" required placeholder="Sharma" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition placeholder-gray-600">
          </div>
        </div>
        <div class="mt-4">
          <label class="block text-sm text-gray-400 mb-2">Email</label>
          <input type="email" required placeholder="rahul@example.com" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition placeholder-gray-600">
        </div>
        <div class="mt-4">
          <label class="block text-sm text-gray-400 mb-2">Phone</label>
          <input type="tel" required placeholder="+91 98765 43210" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition placeholder-gray-600">
        </div>
        <div class="mt-4">
          <label class="block text-sm text-gray-400 mb-2">Password</label>
          <input type="password" required placeholder="••••••••" minlength="6" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition placeholder-gray-600">
        </div>
        <button type="button" onclick="nextStep()" class="w-full mt-6 py-3 bg-gradient-to-r from-primary to-accent rounded-xl font-medium hover:opacity-90 transition">
          Next: Exam Details →
        </button>
      </div>

      <div id="step2" class="hidden">
        <div>
          <label class="block text-sm text-gray-400 mb-2">Select Your Exam</label>
          <select required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition">
            <option value="" class="bg-zinc-900">Choose exam</option>
            <option value="neet" class="bg-zinc-900">NEET</option>
            <option value="jee" class="bg-zinc-900">JEE</option>
            <option value="cuet" class="bg-zinc-900">CUET</option>
            <option value="upsc" class="bg-zinc-900">UPSC</option>
            <option value="ssc" class="bg-zinc-900">SSC</option>
          </select>
        </div>
        <div class="mt-4">
          <label class="block text-sm text-gray-400 mb-2">Preferred City</label>
          <select required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition">
            <option value="" class="bg-zinc-900">Select city</option>
            <option value="delhi" class="bg-zinc-900">Delhi</option>
            <option value="kota" class="bg-zinc-900">Kota</option>
            <option value="jaipur" class="bg-zinc-900">Jaipur</option>
            <option value="noida" class="bg-zinc-900">Noida</option>
            <option value="mumbai" class="bg-zinc-900">Mumbai</option>
            <option value="pune" class="bg-zinc-900">Pune</option>
          </select>
        </div>
        <div class="mt-4">
          <label class="block text-sm text-gray-400 mb-2">Exam Year</label>
          <select required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition">
            <option value="" class="bg-zinc-900">Select year</option>
            <option value="2026" class="bg-zinc-900">2026</option>
            <option value="2027" class="bg-zinc-900">2027</option>
          </select>
        </div>
        <div class="mt-4">
          <label class="flex items-center gap-3 cursor-pointer p-3 bg-white/5 rounded-xl">
            <input type="checkbox" required class="rounded border-gray-600 bg-white/5">
            <span class="text-sm text-gray-400">I agree to Terms of Service and Privacy Policy</span>
          </label>
        </div>
        <div class="flex gap-3 mt-6">
          <button type="button" onclick="prevStep()" class="flex-1 py-3 border border-white/10 rounded-xl font-medium hover:bg-white/5 transition">← Back</button>
          <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-primary to-accent rounded-xl font-medium hover:opacity-90 transition">Create Account</button>
        </div>
      </div>
    </form>

    <p class="text-center mt-6 text-gray-400">
      Already have an account? <a href="login.html" class="text-primary hover:underline">Login</a>
    </p>
  </div>

  <script>
    function nextStep() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      document.getElementById('step1Dot').classList.remove('bg-primary');
      document.getElementById('step1Dot').classList.add('bg-white/20');
      document.getElementById('step2Dot').classList.remove('bg-white/20');
      document.getElementById('step2Dot').classList.add('bg-primary');
    }

    function prevStep() {
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('step2Dot').classList.remove('bg-primary');
      document.getElementById('step2Dot').classList.add('bg-white/20');
      document.getElementById('step1Dot').classList.remove('bg-white/20');
      document.getElementById('step1Dot').classList.add('bg-primary');
    }

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
