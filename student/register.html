<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - CenterBuddy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "background": "#f8f9fa", "primary": "#004655", "primary-container": "#005f73",
        "on-primary": "#ffffff", "on-primary-container": "#91d7ee", "secondary": "#845400",
        "secondary-container": "#ffa91e", "on-secondary": "#ffffff", "on-secondary-container": "#6a4300",
        "surface-container-lowest": "#ffffff", "surface-container-high": "#e7e8e9",
        "surface-container": "#edeeef", "on-surface": "#191c1d", "on-surface-variant": "#3f484c",
        "outline-variant": "#bfc8cc", "error": "#ba1a1a", "tertiary": "#004749",
        "tertiary-container": "#006163", "on-tertiary": "#ffffff", "on-tertiary-container": "#72dde0",
        "surface-dim": "#d9dadb", "surface-bright": "#f8f9fa", "error-container": "#ffdad6",
        "on-error": "#ffffff", "on-error-container": "#93000a", "primary-fixed": "#b2ebff",
        "primary-fixed-dim": "#8bd1e8", "secondary-fixed": "#ffddb6", "secondary-fixed-dim": "#ffb95a",
        "on-secondary-fixed": "#2a1800", "tertiary-fixed": "#89f3f6", "tertiary-fixed-dim": "#6bd7da",
        "on-tertiary-fixed": "#002021", "inverse-surface": "#2e3132", "inverse-on-surface": "#f0f1f2",
        "inverse-primary": "#8bd1e8"
      }
    }
  }
}
</script>
<style>
body { font-family: 'Inter', sans-serif; }
h1, h2, h3 { font-family: 'Public Sans', sans-serif; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">

<!-- TopAppBar -->
<header class="bg-background/70 backdrop-blur-xl docked top-0 sticky z-50 border-b border-outline-variant/20 h-20">
<div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-full">
<div class="flex items-center gap-sm">
<a href="../index.html">
<span class="font-display text-headline-md font-bold text-primary">CenterBuddy</span>
</a>
</div>
<div class="flex items-center gap-sm">
<button id="themeToggle" class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined sun-icon">dark_mode</span>
<span class="material-symbols-outlined moon-icon hidden">light_mode</span>
</button>
</div>
</div>
</header>

<!-- Register Content -->
<main class="flex-1 flex items-center justify-center px-gutter py-xl">
<div class="w-full max-w-lg">
<div class="bg-surface-container-lowest rounded-2xl shadow-lg border border-outline-variant/30 p-lg space-y-lg">

<!-- Step Indicator -->
<div class="flex justify-center gap-sm mb-md">
<div id="step1Dot" class="w-3 h-3 rounded-full bg-primary"></div>
<div id="step2Dot" class="w-3 h-3 rounded-full bg-surface-container"></div>
</div>

<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Create Account</h1>
<p class="text-body-md text-on-surface-variant">Join CenterBuddy for exam logistics support</p>
</div>

<!-- Google Sign Up -->
<button class="w-full flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-xl hover:bg-surface-container transition-all">
<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
<span class="font-label-md text-label-md text-on-surface">Continue with Google</span>
</button>

<div class="flex items-center gap-sm">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">or register with</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>

<form id="registerForm">
<!-- Step 1: Basic Info -->
<div id="step1">
<div class="grid grid-cols-2 gap-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">First Name</label>
<input type="text" required placeholder="Rahul" class="w-full px-md py-sm border border-outline-variant rounded-lg focus:outline-none focus:border-primary bg-surface-container-lowest text-body-md placeholder:text-on-surface-variant/50">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Last Name</label>
<input type="text" required placeholder="Sharma" class="w-full px-md py-sm border border-outline-variant rounded-lg focus:outline-none focus:border-primary bg-surface-container-lowest text-body-md placeholder:text-on-surface-variant/50">
</div>
</div>

<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs mt-sm">Phone Number</label>
<div class="flex">
<span class="inline-flex items-center px-md bg-surface-container text-on-surface-variant border border-r-0 border-outline-variant rounded-l-lg font-label-md text-label-md">+91</span>
<input type="tel" id="phone" maxlength="10" required placeholder="10-digit number" class="flex-1 px-md py-sm border border-outline-variant rounded-r-lg focus:outline-none focus:border-primary bg-surface-container-lowest text-body-md placeholder:text-on-surface-variant/50">
</div>
</div>

<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs mt-sm">Email</label>
<input type="email" required placeholder="rahul@example.com" class="w-full px-md py-sm border border-outline-variant rounded-lg focus:outline-none focus:border-primary bg-surface-container-lowest text-body-md placeholder:text-on-surface-variant/50">
</div>

<button type="button" onclick="nextStep()" class="w-full py-sm bg-primary text-on-primary rounded-xl font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-all mt-md">
Next: Exam Details →
</button>
</div>

<!-- Step 2: Exam Details -->
<div id="step2" class="hidden">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Select Your Exam</label>
<select required class="w-full px-md py-sm border border-outline-variant rounded-lg focus:outline-none focus:border-primary bg-surface-container-lowest text-body-md">
<option value="">Choose exam</option>
<option value="neet">NEET</option>
<option value="jee">JEE Main</option>
<option value="jee-advanced">JEE Advanced</option>
<option value="cuet">CUET</option>
<option value="upsc">UPSC CSE</option>
<option value="upsc-prelims">UPSC Prelims</option>
<option value="ssc">SSC CGL</option>
<option value="other">Other</option>
</select>
</div>

<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs mt-sm">Preferred City</label>
<select required class="w-full px-md py-sm border border-outline-variant rounded-lg focus:outline-none focus:border-primary bg-surface-container-lowest text-body-md">
<option value="">Select city</option>
<option value="delhi">Delhi NCR</option>
<option value="mumbai">Mumbai</option>
<option value="kota">Kota</option>
<option value="bangalore">Bangalore</option>
<option value="hyderabad">Hyderabad</option>
<option value="chennai">Chennai</option>
<option value="pune">Pune</option>
<option value="jaipur">Jaipur</option>
<option value="lucknow">Lucknow</option>
<option value="chandigarh">Chandigarh</option>
<option value="ahmedabad">Ahmedabad</option>
<option value="kolkata">Kolkata</option>
</select>
</div>

<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs mt-sm">Exam Year</label>
<select required class="w-full px-md py-sm border border-outline-variant rounded-lg focus:outline-none focus:border-primary bg-surface-container-lowest text-body-md">
<option value="">Select year</option>
<option value="2026">2026</option>
<option value="2027">2027</option>
<option value="2028">2028</option>
</select>
</div>

<label class="flex items-start gap-sm mt-md cursor-pointer">
<input type="checkbox" required class="mt-1 rounded border-outline-variant">
<span class="text-label-sm text-label-sm text-on-surface-variant">I agree to Terms of Service and Privacy Policy</span>
</label>

<div class="flex gap-sm mt-md">
<button type="button" onclick="prevStep()" class="flex-1 py-sm border border-outline-variant rounded-xl font-label-md text-label-md hover:bg-surface-container transition-all">
← Back
</button>
<button type="submit" class="flex-1 py-sm bg-primary text-on-primary rounded-xl font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-all">
Create Account
</button>
</div>
</div>
</form>
</div>

<div class="text-center mt-lg">
<p class="text-body-md text-on-surface-variant">
Already have an account? 
<a href="login.html" class="text-primary font-label-md text-label-md hover:underline">Login</a>
</p>
</div>
</div>
</main>

<script>
// Theme Toggle
const themeToggle = document.getElementById('themeToggle');
const html = document.documentElement;
if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');

themeToggle.addEventListener('click', () => {
  html.classList.toggle('dark');
  document.querySelector('.sun-icon').classList.toggle('hidden');
  document.querySelector('.moon-icon').classList.toggle('hidden');
  localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
});

function nextStep() {
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  document.getElementById('step1Dot').classList.remove('bg-primary');
  document.getElementById('step1Dot').classList.add('bg-surface-container');
  document.getElementById('step2Dot').classList.remove('bg-surface-container');
  document.getElementById('step2Dot').classList.add('bg-primary');
}

function prevStep() {
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step1').classList.remove('hidden');
  document.getElementById('step2Dot').classList.remove('bg-primary');
  document.getElementById('step2Dot').classList.add('bg-surface-container');
  document.getElementById('step1Dot').classList.remove('bg-surface-container');
  document.getElementById('step1Dot').classList.add('bg-primary');
}

document.getElementById('registerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
