<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#6366f1', accent: '#f472b6' } } }
    }
  </script>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased">
  <nav class="sticky top-0 z-50 bg-zinc-950/90 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl font-bold text-primary">Admin</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-sm text-gray-400 hover:text-white">Dashboard</a>
        <a href="centers.html" class="text-sm text-gray-400 hover:text-white">Centers</a>
        <a href="settings.html" class="text-sm text-white">Settings</a>
      </div>
    </div>
  </nav>

  <div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">Settings</h1>

    <!-- General Settings -->
    <div class="bg-white/5 border border-white/10 rounded-xl p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">General</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-2">Site Name</label>
          <input type="text" value="CenterBuddy" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2">Tagline</label>
          <input type="text" value="India's Exam Logistics Platform" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-primary transition">
        </div>
      </div>
    </div>

    <!-- Exam Categories -->
    <div class="bg-white/5 border border-white/10 rounded-xl p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Exam Categories</h2>
      <div class="space-y-3">
        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
          <span>NEET</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" checked class="sr-only peer">
            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
          </label>
        </div>
        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
          <span>JEE</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" checked class="sr-only peer">
            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
          </label>
        </div>
        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
          <span>CUET</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" checked class="sr-only peer">
            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
          </label>
        </div>
        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
          <span>UPSC</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer">
            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
          </label>
        </div>
      </div>
    </div>

    <!-- Save Button -->
    <button class="w-full py-3 bg-gradient-to-r from-primary to-accent rounded-xl font-medium hover:opacity-90 transition">
      Save Settings
    </button>
  </div>
</body>
</html>
